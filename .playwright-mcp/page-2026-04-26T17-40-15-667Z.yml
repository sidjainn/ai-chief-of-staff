                                - text: "we announce our Series B. since 2021, we have focused on making insurance work better where most people first experience it: at work."
                                - text: insurance is not only a work problem. it is needed equally in life beyond work .
                                - text: for a lot of people in our generation, the real questions begin outside the workplace.
                                - text: how do I protect myself beyond my company cover? parents, siblings, spouse..
                                - text: what happens with healthcare inflation, sabbaticals or a job loss?
                                - text: the risks & mitigations (read insurance) in the life I'm still building over the next 30–40 years?
                                - text: the job and the life are not the same thing. and the coverage most of us have today is only as strong as our current employment - and thats a risk !
                                - text: that's the gap we want to fix at Plum Personal. its our attempt to bring the same clarity, experience and trust we built for companies, directly to people & their loved ones.
                                - text: no expiry and the Plum promise forever (irrespective of your work status)
                                - text: this funding lets us go deeper on that.
                                - text: congratulations to all of us and thank you to everyone who's trusted us.
