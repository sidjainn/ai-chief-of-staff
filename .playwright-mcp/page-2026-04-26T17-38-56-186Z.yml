                          - link [ref=e717] [cursor=pointer]:
                            - /url: /feed/update/urn:li:activity:7448339311583846400/
                            - generic [ref=e718]:
                              - generic [ref=e721]:
                                - text: Hot take on DEI, it won't work unless it is a human priority.
                                - text: During COVID, I had the time to actually sit with this. I enrolled in a DEI course with TISS & ODA and one thing hit me harder than anything else, diversity requires tolerance towards people who are not "like you." People who don't look like you, think like you, act like you. The dissonance is uncomfortable, and businesses don't like discomfort. Anything that challenges that sense of predictability, or sameness, gets quietly deprioritized.
                                - text: We also do not acknowledge that DEI is less about equality and more about equity. Equity requires trade-offs. Trade-offs challenge the pace at which orgs want to grow. And there is very little patience to allow humans to do the actual development work needed to thrive.
                                - text: I'm that People leader who hates celebrating Women's Day and Pride Month, much to the dismay of my People Success team too. I hate giving away tokenistic gifts or doing activities that celebrate these groups of people for that day and then go back to business as usual the next day.
                                - text: People are messy. And organizations like things neatly laid out, from policies to furniture. So the tick-in-the-box activity always feels easier. Build the gender neutral bathroom but don't think about educating the team that's going to have a trans person join. Interview and hire from different communities but don't do the social audit required to correct the language you use every day. Write the policy but don't sit with the discomfort of what it actually asks of your managers, your culture, your people.
                                - text: We keep confusing infrastructure for inclusion. One is visible. The other is work.
                                - link "🏳️‍🌈 Praful Baweja 🌻" [ref=e723]:
                                  - /url: /in/prafulbaweja/
                                - text: wrote something for Humanize,
                                - link "Plum" [ref=e724]:
                                  - /url: https://www.linkedin.com/company/plumhq/
                                  - generic [ref=e726]: Plum
                                - text: ", I couldn't stop thinking about. He talks about the \"hyphenated human\", the person who doesn't fit into one box. No single-axis policy was ever built to hold the full complexity of who your people actually are."
                                - text: Go read this piece (Link in comments). It's one of the more honest and grounded things written on DEI in a long time, especially for the Indian workplace context.
