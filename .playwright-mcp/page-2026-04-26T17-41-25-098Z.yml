                                  - generic [ref=e568]: Plum
                                - text: ", I didn't think I'd end up caring this deeply about health insurance claims."
                                - text: But claims is the only moment in insurance where the product actually has to work. Everything before it is a pitch. Everything after it is a memory. The claim itself is the product.
                                - text: That's the moment we've been building for.
                                - text: "Over the last 4 years, our team has quietly shipped some of the most challenging product work I've been part of:"
                                - text: → Replaced paper claim forms with a digital flow that takes 2 minutes
                                - text: → Built real-time API integrations with insurers so you're never in the dark
                                - text: → Launched ClaimLens - AI that catches your document errors before the insurer does
                                - text: → Created a dispute system that recovered ₹10 Cr+ for users from rejected claims
                                - text: The result? Claims NPS of 79. Automation from 26% to 78%. Reimbursements closing in 36 hours.
                                - text: Today,
                                - link "Plum" [ref=e569]:
                                  - /url: https://www.linkedin.com/company/plumhq/
                                  - generic [ref=e571]: Plum
